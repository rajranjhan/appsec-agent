[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "appsec-agent"
version = "0.1.0"
description = "Evidence-led AI application security review with a bounded Pydantic AI harness"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["pydantic-ai-slim[openai,anthropic]>=1.107.7,<2", "pydantic-settings>=2.10,<3"]

[project.scripts]
appsec-agent = "appsec_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

